<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Our Students</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; }
        .modal { display: none; position: fixed; z-index: 50; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { position: relative; width: 90%; max-width: 800px; aspect-ratio: 16/9; }
    </style>
</head>
<body class="text-slate-900 antialiased min-h-screen">

    <!-- HEADER -->
    <header class="max-w-7xl mx-auto px-6 py-12">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6 border-b border-slate-100 pb-12">
            <img src="Mission_Ignite-Full_Color-BoldTag (1).png" alt="Mission Ignite Logo" class="h-16 w-auto object-contain">
            <div class="text-center md:text-right">
                <h1 class="text-3xl font-extrabold tracking-tight">Meet Our Students</h1>
                <p class="text-slate-500 mt-1">First Shiloh Baptist Church, Buffalo, NY. Tech360 Class</p>
            </div>
        </div>
    </header>

    <!-- GRID -->
    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Example Card: Mary Jordan (Repeat this block for others) -->
            <button onclick="openVideo('https://drive.google.com/file/d/1bXx86WyNBBQoy34wE1ycfgWu4zi8B2hq/preview')" class="group text-left flex flex-col p-4 border border-slate-100 rounded-2xl hover:border-slate-300 transition-all">
                <div class="bg-slate-100 rounded-xl w-full aspect-video flex items-center justify-center font-medium text-slate-500">Click to Play</div>
                <h3 class="mt-4 font-bold text-lg">Mary Jordan</h3>
                <p class="text-slate-500 italic text-sm mt-1">"Everything is getting to be quite exciting for me..."</p>
            </button>
            <!-- Add more buttons here with their respective file IDs -->
        </div>
    </main>

    <!-- MODAL -->
    <div id="videoModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <iframe id="videoPlayer" class="w-full h-full rounded-lg" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function openVideo(url) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            player.src = url;
            modal.classList.add('active');
        }
        function closeModal() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            player.src = '';
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
