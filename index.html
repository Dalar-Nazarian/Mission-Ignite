    <style>
        body {

            background-color: #ffffff;

        }

        /* LAYER ARCHITECTURE */
        #map-bg { 
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            z-index: 1; 
        }

        .zoom-map-container {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 880px;
            height: calc(100% - 48px);
            z-index: 10; 
            border: 8px solid #E31B23; 
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            background: white;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Tablet Adjustments (Portrait / Smaller screens) */
        @media (min-width: 768px) and (max-width: 1023px) {
            .zoom-map-container {
                width: 440px;
                left: 16px;
                top: 80px;
                height: calc(100% - 104px);
                border-width: 6px;
                border-radius: 24px;
            }
        }

        /* Mobile Phone Adjustments */
        @media (max-width: 767px) {
            .zoom-map-container {
                width: calc(100% - 24px);
                left: 12px;
                top: 76px;
                height: calc(100% - 100px);
                border-width: 4px;
                border-radius: 20px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            }
        }

        #map-zoom { height: 100%; width: 100%; }

        /* POPUP STYLING - Adjusted to be 30% smaller */
        .maplibregl-popup {
            z-index: 999 !important;
        }

        .maplibregl-popup-content {
            padding: 0 !important;
            border-radius: 16px !important;
            width: 308px !important; /* 30% smaller than 440px */
            overflow: hidden;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5) !important;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .popup-header {
            background: #E31B23;
            padding: 14px 18px;
            color: white;
        }

        .popup-body {
            padding: 18px;
            background: white;
        }

        .partner-img {
            width: 100%;
            height: 154px;
            object-fit: cover;
            background-color: #f1f5f9;
            margin-bottom: 14px;
            border-radius: 8px;
            display: block;
        }

        /* PRECISION MARKER SYSTEM - 20% Smaller Layouts */
        .ignite-marker {
            width: 32px; 
            height: 32px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .pin-container {
            position: relative;
            width: 27px; 
            height: 34px; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
            display: flex;
            justify-content: center;
        }

        .ignite-marker:hover .pin-container {
            transform: scale(1.4) translateY(-6px);
        }

        .sonar-ring {
            position: absolute;
            bottom: 0;
            width: 6px; 
            height: 6px; 
            background: rgba(227, 27, 35, 0.8);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes sonar {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(5); opacity: 0; }
        }

        .ignite-marker:hover .sonar-ring {
            opacity: 1;
            animation: sonar 1.5s infinite ease-out;
        }

        /* UI ELEMENTS */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .zoom-label {
            position: absolute;
            top: 16px;
            left: 16px;

            background: #E31B23;
            color: white;
            font-size: 11px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 10px rgba(227, 27, 35, 0.3);

            { id: 55, name: "Tonawanda Public Library", address: "333 Main St", city: "Tonawanda", type: "Library", year: "2024-2025", lat: 43.0207, lng: -78.8814, img: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&q=80&w=800", desc: "Offering essential public computing hubs and resource suites to Tonawanda residents." },
            { id: 56, name: "West Side Community Services", address: "161 Vermont St", city: "Buffalo", type: "Partner", year: "2023-2025", lat: 42.909940, lng: -78.892110, img: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&q=80&w=800", desc: "Fostering neighborhood education, family programs, and technology access on the West Side." }
        ];

        let bgMap, zoomMap;
        let isLocked = false;
        const bgMarkers = {};
        const zoomMarkers = {};

        function initMaps() {
            const brightUrl = `https://tiles.stadiamaps.com/styles/osm_bright.json?api_key=${STADIA_API_KEY}`;

            // Centered to place Endicott specifically in the bottom right corner
            bgMap = new maplibregl.Map({
                container: 'map-bg',
                style: brightUrl,
                center: [-77.9, 42.85], 
                zoom: 7.7,
                antialias: true
            });

            // Captures Lockport at the top and Hamburg at the bottom
            zoomMap = new maplibregl.Map({
                container: 'map-zoom',
                style: brightUrl,
                center: [-78.78, 42.94], 
                zoom: 10.1,
                antialias: true,
                attributionControl: false
            });

            bgMap.on('load', () => {
                renderMarkers(bgMap, bgMarkers);
                handleResize(); 
            });
            
            zoomMap.on('load', () => {
                renderMarkers(zoomMap, zoomMarkers);
                handleResize(); 
            });
        }

        function createMarkerElement() {
            const wrapper = document.createElement('div');
            wrapper.className = 'ignite-marker';
            
            wrapper.innerHTML = `
                <div class="sonar-ring"></div>
                <div class="pin-container">
                    <svg width="27" height="34" viewBox="0 0 34 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 0C7.611 0 0 7.611 0 17C0 29.75 17 42 17 42C17 42 34 29.75 34 17C34 7.611 26.389 0 17 0Z" fill="#E31B23"/>
                        <circle cx="17" cy="17" r="6" fill="white"/>
                    </svg>
                </div>
            `;
            return wrapper;
        }

        function renderMarkers(mapInstance, markerStore) {
            partners.forEach(loc => {
                const yearMarkup = loc.year ? `<span class="bg-white/20 text-[9px] font-black tracking-widest px-2.5 py-1 rounded-md uppercase ml-2 whitespace-nowrap">EST. ${loc.year}</span>` : '';
                
                const popupHTML = `
                    <div class="popup-header flex items-center justify-between">
                        <div>
                            <h3 class="font-black text-[12px] uppercase tracking-widest leading-tight">${loc.name}</h3>
                            <p class="text-[9px] opacity-80 font-bold uppercase tracking-tighter mt-0.5">Mission Ignite Node // ${loc.type}</p>
                        </div>
                        ${yearMarkup}
                    </div>
                    <div class="popup-body">
                        <img src="${loc.img}" 
                             onerror="this.src='https://placehold.co/800x450/f1f5f9/475569?text=${encodeURIComponent(loc.name)}'" 
                             class="partner-img" 
                             alt="Building photo">
                        <p class="text-slate-500 text-[11px] font-bold leading-tight mb-3">
                            ${loc.address}<br>${loc.city}, NY
                        </p>
                        <p class="text-slate-800 text-[12px] font-medium leading-snug italic border-l-4 border-red-500 pl-3">
                            "${loc.desc}"
                        </p>
                    </div>
                `;

                const marker = new maplibregl.Marker({ 
                    element: createMarkerElement(),
                    anchor: 'bottom'
                })
                    .setLngLat([loc.lng, loc.lat])
                    .setPopup(new maplibregl.Popup({ 
                        offset: [0, -34], 
                        closeButton: false
                    }).setHTML(popupHTML))
                    .addTo(mapInstance);

                markerStore[loc.id] = marker;
            });
        }

        // NAVIGATION LOCK FUNCTION
        function toggleLock() {
            isLocked = !isLocked;
            const statusEl = document.getElementById('lockStatus');
            const labelEl = document.getElementById('lockLabel');

            [bgMap, zoomMap].forEach(map => {
                const action = isLocked ? 'disable' : 'enable';
                map.dragPan[action]();
                map.scrollZoom[action]();
                map.boxZoom[action]();
                map.keyboard[action]();
                map.doubleClickZoom[action]();
                map.touchZoomRotate[action]();
            });

            statusEl.className = `w-2.5 h-2.5 rounded-full ${isLocked ? 'bg-red-600 animate-pulse' : 'bg-slate-300'}`;
            labelEl.textContent = isLocked ? 'Unlock Navigation' : 'Lock Navigation';
        }

        // RESPONSIVE SCREEN HANDLING LOGIC
        function switchMobileTab(tab) {
            currentMobileTab = tab;
            const container = document.getElementById('zoom-container');
            const bgBtn = document.getElementById('btn-tab-bg');
            const zoomBtn = document.getElementById('btn-tab-zoom');

            if (tab === 'bg') {
                container.style.display = 'none';
                bgBtn.className = "flex-1 py-2 text-xs font-extrabold rounded-full transition-all text-center bg-[#E31B23] text-white shadow";
                zoomBtn.className = "flex-1 py-2 text-xs font-extrabold rounded-full transition-all text-center text-slate-600 hover:text-slate-900";
                
                if (bgMap) {
                    setTimeout(() => bgMap.resize(), 50);
                }
            } else {
                container.style.display = 'block';
                zoomBtn.className = "flex-1 py-2 text-xs font-extrabold rounded-full transition-all text-center bg-[#E31B23] text-white shadow";
                bgBtn.className = "flex-1 py-2 text-xs font-extrabold rounded-full transition-all text-center text-slate-600 hover:text-slate-900";
                
                if (zoomMap) {
                    setTimeout(() => zoomMap.resize(), 50);
                }
            }
        }

        // Keeps maps synchronized on resizing viewport changes
        function handleResize() {
            const container = document.getElementById('zoom-container');
            if (window.innerWidth >= 1024) {
                // Desktop rules: Keep both maps active and layered side-by-side
                container.style.display = 'block';
                if (bgMap) bgMap.resize();
                if (zoomMap) zoomMap.resize();
            } else {
                // Mobile/Tablet rules: Honor tab switcher configuration
                switchMobileTab(currentMobileTab);
            }
        }

        window.addEventListener('resize', handleResize);
        window.onload = initMaps;
    </script>
